<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" role="img" aria-label="CONTACT"><title>CONTACT</title><style>
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 1.6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-4deg) translateY(-1px)}to{transform:rotate(4deg) translateY(2px)}}
.slamL{animation:slamL .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slamL{from{transform:translateX(-1100px)}to{transform:none}}
.slamR{animation:slamR .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slamR{from{transform:translateX(1100px)}to{transform:none}}
.drop{transform-box:fill-box;transform-origin:center;animation:drop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{transform:translateY(-400px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.thump{transform-box:fill-box;transform-origin:center;animation:thump 1.2s ease-in-out infinite}
@keyframes thump{0%,100%{transform:scale(1)}12%{transform:scale(1.15)}24%{transform:scale(1)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.marquee{animation:marquee linear infinite}
@keyframes marquee{to{transform:translateX(var(--d))}}
.type{transform-box:fill-box;transform-origin:0 50%;animation:type linear both}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style><defs></defs><g class="slamL"><polygon points="10,58 860,40 856,50 12,66" fill="#e60012"/></g><g transform="translate(34.4,37.8) rotate(8.3)"><g class="pop" style="animation-delay:0.10s"><polygon points="-13.9,-16.3 14.3,-18.1 12.9,19.5 -14.2,18.6" fill="#e60012" stroke="#000" stroke-width="2"/><text y="11.5" font-size="31.0" fill="#fff" font-family="'Courier New',Courier,monospace" font-weight="900" text-anchor="middle">C</text></g></g><g transform="translate(67.8,38.2) rotate(7.4)"><g class="pop" style="animation-delay:0.14s"><polygon points="-16.7,-25.4 19.4,-22.1 16.6,19.8 -15.5,22.5" fill="#e60012" stroke="#000" stroke-width="2"/><text y="14.2" font-size="38.3" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-weight="900" text-anchor="middle">o</text></g></g><g transform="translate(104.9,38.6) rotate(4.6)"><g class="pop" style="animation-delay:0.18s"><polygon points="-20.2,-23.7 15.0,-22.9 16.4,23.9 -16.2,25.0" fill="#fff" stroke="#000" stroke-width="2"/><text y="14.3" font-size="38.5" fill="#e60012" font-family="'Arial Black',Arial,sans-serif" font-weight="900" text-anchor="middle">n</text></g></g><g transform="translate(141.9,38.6) rotate(1.7)"><g class="pop" style="animation-delay:0.22s"><polygon points="-16.5,-19.9 19.9,-19.5 18.7,20.4 -15.4,25.4" fill="#000" stroke="#000" stroke-width="2"/><text y="14.1" font-size="38.0" fill="#fff" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="900" text-anchor="middle">t</text></g></g><g transform="translate(177.2,35.3) rotate(-4.7)"><g class="pop" style="animation-delay:0.26s"><g class="wob" style="animation-delay:-1.21s"><polygon points="-15.4,-20.8 15.3,-23.1 18.5,18.0 -16.6,20.2" fill="#e60012" stroke="#000" stroke-width="2"/><text y="13.0" font-size="34.9" fill="#fff" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="900" text-anchor="middle">A</text></g></g></g><g transform="translate(212.0,40.7) rotate(-3.4)"><g class="pop" style="animation-delay:0.30s"><polygon points="-17.2,-19.0 16.1,-24.6 17.9,19.2 -19.1,21.5" fill="#fff" stroke="#000" stroke-width="2"/><text y="13.8" font-size="37.1" fill="#e60012" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="900" text-anchor="middle">c</text></g></g><g transform="translate(244.6,41.3) rotate(-3.7)"><g class="pop" style="animation-delay:0.34s"><polygon points="-14.6,-18.0 14.1,-17.1 14.4,18.1 -13.4,20.0" fill="#fff" stroke="#000" stroke-width="2"/><text y="11.2" font-size="30.0" fill="#000" font-family="'Courier New',Courier,monospace" font-weight="900" text-anchor="middle">t</text></g></g></svg>
