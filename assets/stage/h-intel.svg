<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="900" height="76" role="img" aria-label="NEW INTEL"><title>NEW INTEL</title><style>
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}60%{transform:scale(1.3) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.wob{transform-box:fill-box;transform-origin:center;animation:wob 1.6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-4deg) translateY(-1px)}to{transform:rotate(4deg) translateY(2px)}}
.slamL{animation:slamL .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slamL{from{transform:translateX(-1100px)}to{transform:none}}
.slamR{animation:slamR .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slamR{from{transform:translateX(1100px)}to{transform:none}}
.drop{transform-box:fill-box;transform-origin:center;animation:drop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes drop{from{transform:translateY(-400px) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.thump{transform-box:fill-box;transform-origin:center;animation:thump 1.2s ease-in-out infinite}
@keyframes thump{0%,100%{transform:scale(1)}12%{transform:scale(1.15)}24%{transform:scale(1)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.marquee{animation:marquee linear infinite}
@keyframes marquee{to{transform:translateX(var(--d))}}
.type{transform-box:fill-box;transform-origin:0 50%;animation:type linear both}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style><defs></defs><g class="slamL"><polygon points="10,58 860,40 856,50 12,66" fill="#e60012"/></g><g transform="translate(38.3,40.4) rotate(-8.3)"><g class="pop" style="animation-delay:0.10s"><polygon points="-17.2,-24.6 19.0,-22.7 18.8,21.2 -18.8,22.7" fill="#fff" stroke="#000" stroke-width="2"/><text y="14.7" font-size="39.4" fill="#000" font-family="Impact,'Arial Black',sans-serif" font-weight="900" text-anchor="middle">n</text></g></g><g transform="translate(76.6,38.0) rotate(8.7)"><g class="pop" style="animation-delay:0.14s"><polygon points="-16.1,-24.5 21.3,-21.0 18.0,26.1 -20.7,21.5" fill="#000" stroke="#000" stroke-width="2"/><text y="14.8" font-size="39.8" fill="#fff" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="900" text-anchor="middle">e</text></g></g><g transform="translate(110.7,37.0) rotate(0.2)"><g class="pop" style="animation-delay:0.18s"><polygon points="-13.8,-15.5 13.8,-18.4 14.2,20.0 -14.8,18.4" fill="#e60012" stroke="#000" stroke-width="2"/><text y="11.3" font-size="30.3" fill="#fff" font-family="Georgia,'Times New Roman',serif" font-weight="900" text-anchor="middle">W</text></g></g><g transform="translate(159.7,37.3) rotate(9.1)"><g class="pop" style="animation-delay:0.26s"><polygon points="-16.8,-24.2 16.4,-22.7 17.9,24.5 -16.8,22.4" fill="#fff" stroke="#000" stroke-width="2"/><text y="14.2" font-size="38.3" fill="#e60012" font-family="Georgia,'Times New Roman',serif" font-weight="900" text-anchor="middle">i</text></g></g><g transform="translate(194.0,41.2) rotate(3.2)"><g class="pop" style="animation-delay:0.30s"><polygon points="-13.3,-17.2 15.6,-17.7 14.9,18.1 -13.5,20.9" fill="#fff" stroke="#000" stroke-width="2"/><text y="12.0" font-size="32.3" fill="#e60012" font-family="'Arial Black',Arial,sans-serif" font-weight="900" text-anchor="middle">n</text></g></g><g transform="translate(226.1,37.9) rotate(4.6)"><g class="pop" style="animation-delay:0.34s"><polygon points="-14.9,-18.1 17.5,-21.1 13.1,22.0 -13.1,18.1" fill="#fff" stroke="#000" stroke-width="2"/><text y="12.7" font-size="34.1" fill="#e60012" font-family="'Courier New',Courier,monospace" font-weight="900" text-anchor="middle">T</text></g></g><g transform="translate(256.6,35.4) rotate(5.1)"><g class="pop" style="animation-delay:0.38s"><g class="wob" style="animation-delay:-0.23s"><polygon points="-11.9,-15.0 11.3,-15.2 14.6,15.0 -14.0,15.9" fill="#e60012" stroke="#000" stroke-width="2"/><text y="10.7" font-size="28.8" fill="#fff" font-family="Impact,'Arial Black',sans-serif" font-weight="900" text-anchor="middle">E</text></g></g></g><g transform="translate(284.6,35.3) rotate(-2.5)"><g class="pop" style="animation-delay:0.42s"><polygon points="-12.4,-17.1 11.1,-16.8 14.9,16.0 -11.3,14.9" fill="#fff" stroke="#000" stroke-width="2"/><text y="10.8" font-size="29.0" fill="#000" font-family="Impact,'Arial Black',sans-serif" font-weight="900" text-anchor="middle">l</text></g></g></svg>
